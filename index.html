  <script>
   (() => {
    let shortcut = document.querySelector('.account-shortcut');
    let root = document.querySelector('#root');
    if (!shortcut || !root) return;
    let catalogBooks = null;
    let catalogRequestStarted = false;
    const catalogPageSize = 12;
    let catalogPage = 1;
    let catalogSearch = '';
    let catalogCategory = '';
    let catalogAuthor = '';
    let catalogSort = 'newest';
    let renderShopCart = () => {};

    const setText = (element, text) => {
     if (element && element.textContent !== text) element.textContent = text;
    };

    let checkedAccountToken = null;
    let accountSessionActive = false;
    const refreshAccountShortcut = async () => {
     const accountShortcut = document.querySelector('.account-shortcut');
     const welcome = accountShortcut?.querySelector('.account-shortcut-welcome');
     const action = accountShortcut?.querySelector('.account-shortcut-action');
     if (!accountShortcut || !welcome || !action) return;
     if (!accountShortcut.dataset.sessionClickGuard) {
      accountShortcut.dataset.sessionClickGuard = 'true';
      accountShortcut.addEventListener('click', (event) => {
       if (accountSessionActive) event.preventDefault();
      });
     }

     const token = localStorage.getItem('nocturnal_user_token');
     if (!token) {
      checkedAccountToken = null;
      accountSessionActive = false;
      accountShortcut.href = '/login';
      accountShortcut.setAttribute('aria-label', 'Entrar ou criar uma conta');
      setText(welcome, 'Bem-vindo(a)');
      setText(action, 'Entrar ou Cadastrar');
      return;
     }
     if (token === checkedAccountToken) return;
     checkedAccountToken = token;

     try {
      const response = await fetch('/api/auth/user/me', {
       headers: { Authorization: `Bearer ${token}` }
      });
      if (!response.ok) {
       if (response.status === 401 && localStorage.getItem('nocturnal_user_token') === token) {
        localStorage.removeItem('nocturnal_user_token');
        checkedAccountToken = null;
        accountSessionActive = false;
        accountShortcut.href = '/login';
        accountShortcut.setAttribute('aria-label', 'Entrar ou criar uma conta');
        setText(welcome, 'Bem-vindo(a)');
        setText(action, 'Entrar ou Cadastrar');
       }
       return;
      }

      const data = await response.json();
      const name = String(data.user?.name || '').trim();
      if (!name || localStorage.getItem('nocturnal_user_token') !== token) return;
      accountSessionActive = true;
      accountShortcut.href = '/login';
      accountShortcut.setAttribute('aria-label', `Conta de ${name}`);
      setText(welcome, 'Olá,');
      setText(action, name);
     } catch (error) {
      console.error('Não foi possível carregar o nome da conta:', error);
     }
    };

    window.addEventListener('storage', (event) => {
     if (event.key === 'nocturnal_user_token') {
      checkedAccountToken = null;
      refreshAccountShortcut();
     }
    });
    window.addEventListener('pageshow', () => {
     checkedAccountToken = null;
     refreshAccountShortcut();
    });

    const syncPageRoute = () => {
     const routes = {
      'catalogo-livros': 'books',
      'sobre': 'about',
      'novidades': 'news'
     };
     const page = routes[window.location.hash.slice(1)] || 'home';
     document.body.dataset.sitePage = page;
     document.title = {
      home: 'Nocturnal Chronicles — Dark Romance',
      books: 'Livros — Nocturnal Chronicles',
      about: 'Sobre nós — Nocturnal Chronicles',
      news: 'Novidades — Nocturnal Chronicles'
     }[page];
    };

    const setupNewsletterForm = (form, input, button, feedback) => {
     if (form.dataset.newsletterReady === 'true') return;
     form.dataset.newsletterReady = 'true';
     form.addEventListener('submit', async (event) => {
      event.preventDefault();
      event.stopPropagation();
      if (!input.reportValidity()) return;

      button.disabled = true;
      feedback.dataset.state = '';
      feedback.textContent = 'Salvando sua inscrição...';
      try {
       const response = await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: input.value.trim() })
       });
       const result = await response.json();
       if (!response.ok) throw new Error(result.error || 'Não foi possível salvar sua inscrição.');
       feedback.dataset.state = 'success';
       feedback.textContent = result.message || 'Inscrição confirmada! Você receberá nossas novidades.';
       form.reset();
      } catch (error) {
       feedback.dataset.state = 'error';
       feedback.textContent = error.message || 'Não foi possível salvar sua inscrição. Tente novamente.';

       button.disabled = false;
      }
     }, { capture: true });

    const updateFeaturedBook = (book) => {
     const section = root.querySelector('#destaque');

     const title = section.querySelector('h3');
     const featuredHeading = section.querySelector('h2');
     const featuredEyebrow = section.querySelector('h2')?.previousElementSibling;
     const titleParent = title && title.parentElement;
     const image = section.querySelector('img');
     const author = titleParent && titleParent.querySelector('p.text-muted-foreground');
     const description = titleParent && titleParent.querySelector('p.text-lg');
     const price = titleParent && titleParent.querySelector('.font-display.text-4xl');
     if (!title || !image || !titleParent) return;

     setText(featuredEyebrow, 'Livro em destaque');
     setText(featuredHeading, 'Conheça o livro em destaque.');
     setText(title, book.title || 'Livro');
     const coverSource = book.cover_image || '/logo.png';
     image.removeAttribute('srcset');
     image.src = coverSource;
     image.alt = book.title || 'Capa do livro';
     const imageWrapper = image.closest('[data-base44-image]');
     if (imageWrapper) {
      imageWrapper.replaceWith(image);
     }
     if (author) setText(author, `por ${book.author || 'Autor(a) não informado(a)'}`);
     if (description) setText(description, book.description || 'Conheça este livro publicado na coleção Nocturnal Chronicles.');
     if (price) setText(price, new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(book.price) || 0));

     const edition = titleParent.querySelector('.flex.items-center.gap-3');
     if (edition) edition.style.setProperty('display', 'none', 'important');
     const tags = titleParent.querySelector('.flex.flex-wrap');
     if (tags) tags.style.setProperty('display', 'none', 'important');
     const quote = titleParent.querySelector('blockquote');
     if (quote) quote.style.setProperty('display', 'none', 'important');
     const triggerWarnings = [...titleParent.querySelectorAll('button')].find((button) => button.textContent.includes('Avisos de Gatilho'));
     if (triggerWarnings) triggerWarnings.parentElement.style.setProperty('display', 'none', 'important');

     const oldAction = [...titleParent.querySelectorAll('button')].find((button) => button.textContent.includes('Reclamar Sua Cópia'));
     if (oldAction && !oldAction.dataset.catalogAction) {
      const action = document.createElement('a');

      action.href = '#catalogo-livros';
      action.textContent = 'Ver no catálogo';
      action.dataset.catalogAction = 'true';
      oldAction.replaceWith(action);
     }
     section.dataset.databaseFeaturedBook = String(book.id);

           <button class="database-cart-checkout" type="button">Finalizar compra</button>
          </div>
          <form class="database-checkout-form" hidden>
           <label>Seu nome<input name="customer_name" autocomplete="name" required maxlength="255"></label>
           <label>Seu e-mail<input name="customer_email" type="email" autocomplete="email" required maxlength="255"></label>
           <button type="submit">Gerar Pix</button>
          </form>
          <div class="database-pix-result" hidden>
           <p class="database-pix-instructions"></p>

           <img class="database-pix-qr" alt="QR Code Pix" hidden>
           <label>Pix copia e cola<textarea readonly></textarea></label>
           <button class="database-pix-copy" type="button">Copiar código Pix</button>
          </div>
          <p class="database-checkout-message" role="status" aria-live="polite"></p>
         </div>
        </dialog>
       </div>`;
      gallery.after(shop);

      const checkoutDialog = shop.querySelector('.database-checkout-dialog');
      const cartStorageKey = 'nocturnal_book_cart';
      let cartItems = [];
      try {
       const storedCart = JSON.parse(localStorage.getItem(cartStorageKey) || '[]');
       if (Array.isArray(storedCart)) {
        cartItems = storedCart.filter((item) => item && Number.isInteger(Number(item.book_id)) && Number.isInteger(Number(item.quantity)) && Number(item.quantity) > 0)
         .map((item) => ({ book_id: Number(item.book_id), quantity: Math.min(20, Number(item.quantity)) }));
       }
      } catch (error) {
       console.error('Não foi possível restaurar o carrinho:', error);
      }
      const cartView = shop.querySelector('.database-cart-view');
      const checkoutForm = shop.querySelector('.database-checkout-form');
      const pixResult = shop.querySelector('.database-pix-result');
      const checkoutMessage = shop.querySelector('.database-checkout-message');
      const persistCart = () => {
       localStorage.setItem(cartStorageKey, JSON.stringify(cartItems));
      };
      const renderCart = () => {
       const cartItemsElement = shop.querySelector('.database-cart-items');
       const booksById = new Map((catalogBooks || []).map((book) => [Number(book.id), book]));
       cartItems = cartItems.filter((item) => booksById.has(Number(item.book_id)) && booksById.get(Number(item.book_id)).ebook_available);
       persistCart();
       cartItemsElement.replaceChildren();
       let total = 0;
       for (const item of cartItems) {
        const book = booksById.get(Number(item.book_id));
        const quantity = Number(item.quantity);
        total += Number(book.price) * quantity;
        const row = document.createElement('article');
        row.className = 'database-cart-item';
        const image = document.createElement('img');
        image.src = book.cover_image || '/logo.png';
        image.alt = '';
        const details = document.createElement('div');
        const title = document.createElement('h3');
        title.textContent = book.title;
        const price = document.createElement('p');
        price.textContent = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(book.price));
        const controls = document.createElement('div');
        controls.className = 'database-cart-item-controls';
        for (const [label, change] of [['−', -1], ['+', 1]]) {
         const control = document.createElement('button');
         control.type = 'button';
         control.textContent = label;
         control.setAttribute('aria-label', `${change < 0 ? 'Diminuir' : 'Aumentar'} quantidade de ${book.title}`);
         control.disabled = change > 0 && quantity >= 20;
         control.addEventListener('click', () => {
          item.quantity += change;
          if (item.quantity <= 0) cartItems = cartItems.filter((entry) => entry !== item);
          resetCheckout();
          renderCart();
         });
         controls.append(control);
        }
        const count = document.createElement('span');
        count.textContent = String(quantity);
        controls.insertBefore(count, controls.lastChild);
        details.append(title, price, controls);
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'database-cart-remove';
        remove.textContent = '×';
        remove.setAttribute('aria-label', `Remover ${book.title} do carrinho`);
        remove.addEventListener('click', () => {
         cartItems = cartItems.filter((entry) => entry !== item);
         resetCheckout();
         renderCart();
        });
        row.append(image, details, remove);
        cartItemsElement.append(row);
       }
       shop.querySelector('.database-cart-total-value').textContent =
        new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(total);
       shop.querySelector('.database-cart-checkout').disabled = cartItems.length === 0;
       const cartButton = Array.from(root.querySelectorAll('header button'))
        .find((button) => button.textContent.includes('Carrinho'));
       if (cartButton) {
        let count = cartButton.querySelector('.database-cart-count');
        if (!count) {
         count = document.createElement('span');
         count.className = 'database-cart-count';
         cartButton.append(count);
        }
        const itemCount = cartItems.reduce((sum, item) => sum + item.quantity, 0);
        count.textContent = String(itemCount);
        count.hidden = itemCount === 0;
        cartButton.setAttribute('aria-label', itemCount ? `Carrinho, ${itemCount} itens` : 'Carrinho');
       }
      };
      const resetCheckout = () => {
       checkoutForm.hidden = true;
       pixResult.hidden = true;
       cartView.hidden = false;
       checkoutMessage.textContent = '';
      };
      const continueToCheckoutAfterLogin = () => {
       const token = localStorage.getItem('nocturnal_user_token');
       if (!token) {
        const returnUrl = encodeURIComponent('/?checkout=1#catalogo-livros');
        location.href = `/login?next=${returnUrl}`;
        return false;
       }
       return true;
      };
      renderShopCart = renderCart;
      shop.querySelector('.database-checkout-close').addEventListener('click', () => checkoutDialog.close());
      shop.querySelector('.database-shop-grid').addEventListener('click', (event) => {
       const button = event.target.closest('[data-buy-book]');
       if (!button || button.disabled) return;
       const book = catalogBooks?.find((item) => Number(item.id) === Number(button.dataset.buyBook));
       if (!book) return;
       const inCart = cartItems.find((item) => Number(item.book_id) === Number(book.id));
       if (inCart) inCart.quantity = Math.min(20, inCart.quantity + 1);
       else cartItems.push({ book_id: Number(book.id), quantity: 1 });
       renderCart();
       resetCheckout();
       if (!continueToCheckoutAfterLogin()) return;
       checkoutDialog.showModal();
      });
      shop.querySelector('.database-cart-checkout').addEventListener('click', () => {
       if (!continueToCheckoutAfterLogin()) return;
       checkoutForm.reset();
       cartView.hidden = true;
       checkoutForm.hidden = false;
       checkoutForm.elements.customer_name.focus();
      });
      checkoutForm.addEventListener('submit', async (event) => {
       event.preventDefault();
       const form = event.currentTarget;
       const button = form.querySelector('button[type="submit"]');
       const message = checkoutMessage;
       button.disabled = true;
       message.textContent = 'Gerando sua cobrança Pix...';
       try {
        const token = localStorage.getItem('nocturnal_user_token');
        if (!token) {
         continueToCheckoutAfterLogin();
         return;
        }
        const response = await fetch('/api/orders', {
         method: 'POST',
         headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
         body: JSON.stringify({
          customer_name: form.elements.customer_name.value.trim(),
          customer_email: form.elements.customer_email.value.trim(),
          items: cartItems.map((item) => ({ book_id: item.book_id, quantity: item.quantity }))
         })
        });
        const result = await response.json();
        if (response.status === 401) {
         localStorage.removeItem('nocturnal_user_token');
         continueToCheckoutAfterLogin();
         return;
        }
        if (!response.ok) throw new Error(result.error || 'Não foi possível iniciar o pagamento.');
        if (!result.payment?.brCode) throw new Error('A cobrança Pix foi criada sem um código para pagamento.');
        const qr = shop.querySelector('.database-pix-qr');
        qr.hidden = !result.payment.brCodeBase64;
        if (result.payment.brCodeBase64) qr.src = result.payment.brCodeBase64;
        const devWarning = shop.querySelector('.database-pix-dev-warning');
        devWarning.hidden = !result.payment.devMode;
        devWarning.textContent = result.payment.devMode
         ? 'Pix de teste (Dev Mode): não pague este QR Code pelo app do banco. Para testar, simule o pagamento pela API de desenvolvimento da AbacatePay. Para aceitar Pix real, configure uma chave de produção.'
         : '';
        shop.querySelector('.database-pix-instructions').textContent = result.payment.devMode
         ? 'Cobrança de teste criada. Esta cobrança não movimenta dinheiro.'
         : 'Pague pelo app do seu banco. Após a confirmação, enviaremos os livros em PDF para seu e-mail.';
        shop.querySelector('.database-pix-result textarea').value = result.payment.brCode;
        cartItems = [];
        persistCart();
        form.hidden = true;
        pixResult.hidden = false;
        message.textContent = `Pedido ${result.order_ids?.map((id) => `#${id}`).join(', ') || `#${result.order_id}`} criado.`;
        const copyButton = shop.querySelector('.database-pix-copy');
        copyButton.onclick = async () => {
         try {
          await navigator.clipboard.writeText(shop.querySelector('.database-pix-result textarea').value);
          checkoutMessage.textContent = 'Código Pix copiado.';
         } catch (error) {
          checkoutMessage.textContent = 'Não foi possível copiar. Selecione e copie o código Pix.';
         }
        };
       } catch (error) {
        message.textContent = error.message;
       } finally {
        button.disabled = false;
       }
      });

      shop.querySelector('.database-shop-search').addEventListener('input', (event) => {
       catalogSearch = event.currentTarget.value.trim().toLocaleLowerCase('pt-BR');
       catalogPage = 1;
       showDatabaseCatalog(catalogBooks || []);
      });
      shop.querySelector('.database-shop-categories').addEventListener('click', (event) => {
       const option = event.target.closest('[data-category]');
       if (!option) return;
       catalogCategory = option.dataset.category;
       catalogPage = 1;
       showDatabaseCatalog(catalogBooks || []);
      });
      shop.querySelector('.database-shop-authors').addEventListener('click', (event) => {
       const option = event.target.closest('[data-author]');
       if (!option) return;
       catalogAuthor = option.dataset.author;
       catalogPage = 1;
       showDatabaseCatalog(catalogBooks || []);
      });
      shop.querySelector('.database-shop-sort').addEventListener('change', (event) => {
       catalogSort = event.currentTarget.value;
       catalogPage = 1;
       showDatabaseCatalog(catalogBooks || []);
      });
      const newsletterForm = shop.querySelector('.database-shop-newsletter');
      setupNewsletterForm(
       newsletterForm,
       newsletterForm.querySelector('input[type="email"]'),
       newsletterForm.querySelector('button[type="submit"]'),
       shop.querySelector('.database-shop-newsletter-feedback')
      );
      shop.querySelectorAll('[data-page-direction]').forEach((button) => {
       button.addEventListener('click', () => {
        catalogPage += Number(button.dataset.pageDirection);
        showDatabaseCatalog(catalogBooks || []);
       });
      });
     }

     shop.hidden = false;
     const intro = shop.querySelector('.database-shop-intro');
     intro.textContent = books.length
      ? `${books.length} ${books.length === 1 ? 'livro disponível' : 'livros disponíveis'} para você descobrir.`
      : 'Estamos preparando novas histórias para você.';
     const categories = [...new Set(books.map((book) => String(book.category || '').trim()).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'pt-BR'));
     const authors = [...new Set(books.map((book) => String(book.author || '').trim()).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'pt-BR'));
     const selectedCategory = categories.includes(catalogCategory) ? catalogCategory : '';
     if (selectedCategory !== catalogCategory) catalogCategory = selectedCategory;
     const selectedAuthor = authors.includes(catalogAuthor) ? catalogAuthor : '';
     if (selectedAuthor !== catalogAuthor) catalogAuthor = selectedAuthor;
     const heading = shop.querySelector('.database-shop-heading');
     heading.textContent = (catalogCategory || (categories.length === 1 ? categories[0] : 'Livros para sua próxima leitura'))
      .toLocaleUpperCase('pt-BR');
     const categoryList = shop.querySelector('.database-shop-categories');
     const categoryOptions = [['', 'Todas as categorias'], ...categories.map((category) => [category, category])];
     categoryList.replaceChildren(...categoryOptions.map(([value, label]) => {
      const option = document.createElement('button');
      option.type = 'button';
      option.className = 'database-shop-category-option';
      option.dataset.category = value;
      option.setAttribute('aria-pressed', String(value === catalogCategory));
      option.textContent = label;
      return option;
     }));
     const authorList = shop.querySelector('.database-shop-authors');
     authorList.replaceChildren(...authors.map((author) => {
      const option = document.createElement('button');
      option.type = 'button';
      option.className = 'database-shop-category-option';
      option.dataset.author = author;
      option.setAttribute('aria-pressed', String(author === catalogAuthor));
      option.textContent = `${author} (${books.filter((book) => String(book.author || '').trim() === author).length})`;
      return option;
     }));
     shop.querySelector('.database-shop-author-filters').hidden = authors.length === 0;
     shop.querySelector('.database-shop-search').value = catalogSearch;
     shop.querySelector('.database-shop-sort').value = catalogSort;

     let filteredBooks = books.filter((book) => {
      const matchesCategory = !catalogCategory || String(book.category || '').trim() === catalogCategory;
      const matchesAuthor = !catalogAuthor || String(book.author || '').trim() === catalogAuthor;
      const searchable = `${book.title || ''} ${book.author || ''} ${book.category || ''}`.toLocaleLowerCase('pt-BR');
      return matchesCategory && matchesAuthor && (!catalogSearch || searchable.includes(catalogSearch));
     });
     if (catalogSort === 'title') filteredBooks.sort((a, b) => String(a.title || '').localeCompare(String(b.title || ''), 'pt-BR'));
     if (catalogSort === 'price-asc') filteredBooks.sort((a, b) => Number(a.price) - Number(b.price));
     if (catalogSort === 'price-desc') filteredBooks.sort((a, b) => Number(b.price) - Number(a.price));
     if (catalogSort === 'newest') filteredBooks.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

     const pageCount = Math.max(1, Math.ceil(filteredBooks.length / catalogPageSize));
     catalogPage = Math.max(1, Math.min(catalogPage, pageCount));
     const startIndex = (catalogPage - 1) * catalogPageSize;
     const pageBooks = filteredBooks.slice(startIndex, startIndex + catalogPageSize);
     const grid = shop.querySelector('.database-shop-grid');
     grid.replaceChildren();

     if (!pageBooks.length) {
      const empty = document.createElement('p');
      empty.className = 'database-shop-empty';
      empty.textContent = books.length
       ? 'Nenhum livro encontrado. Tente mudar a busca ou a categoria.'
       : 'Ainda não há livros publicados. Volte em breve para conhecer as novidades.';
      grid.append(empty);
     } else {
      pageBooks.forEach((book) => {
       const card = document.createElement('article');
       card.className = 'database-shop-card';

       const cover = document.createElement('div');
       cover.className = 'database-shop-cover';
       const image = document.createElement('img');
       image.src = book.cover_image || '/logo.png';
       image.alt = `Capa de ${book.title || 'livro'}`;
       image.loading = 'lazy';
       image.addEventListener('error', () => {
        if (image.src !== new URL('/logo.png', location.href).href) image.src = '/logo.png';
       }, { once: true });
       cover.append(image);
       if (book.is_featured) {
        const badge = document.createElement('span');
        badge.className = 'database-shop-badge';
        badge.textContent = 'Destaque';
        cover.append(badge);
       }

       const category = document.createElement('p');
       category.className = 'database-shop-category-label';
       category.textContent = book.category || 'Nocturnal Chronicles';
       const title = document.createElement('h3');
       title.className = 'database-shop-title';
       title.textContent = book.title || 'Livro sem título';
       const author = document.createElement('p');
       author.className = 'database-shop-author';
       author.textContent = `por ${book.author || 'Autor(a) não informado(a)'}`;
       const description = document.createElement('p');
       description.className = 'database-shop-description';
       description.textContent = book.description || 'Conheça este livro da coleção Nocturnal Chronicles.';
       const price = document.createElement('p');
       price.className = 'database-shop-price';
       price.textContent = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(book.price) || 0);

       const buyButton = document.createElement('button');
       buyButton.type = 'button';
       buyButton.className = 'database-shop-buy';
       buyButton.dataset.buyBook = String(book.id);
       buyButton.disabled = !book.ebook_available;
       buyButton.textContent = book.ebook_available ? 'Comprar' : 'PDF em breve';

       card.append(cover, category, title, author, description, price, buyButton);
       grid.append(card);
      });
     }

     shop.querySelector('.database-shop-results').textContent = filteredBooks.length
      ? `Exibindo ${startIndex + 1}–${Math.min(startIndex + pageBooks.length, filteredBooks.length)} de ${filteredBooks.length} livros`
      : 'Nenhum livro corresponde aos filtros.';
     const pagination = shop.querySelector('.database-shop-pagination');
     pagination.hidden = filteredBooks.length === 0;
     pagination.querySelector('[data-page-direction="-1"]').disabled = catalogPage <= 1;
     pagination.querySelector('.database-shop-page-label').textContent = `Página ${catalogPage} de ${pageCount}`;
     pagination.querySelector('[data-page-direction="1"]').disabled = catalogPage >= pageCount;
     renderShopCart();
     if (new URLSearchParams(location.search).get('checkout') === '1' && !shop.dataset.resumedCheckout) {
      shop.dataset.resumedCheckout = 'true';
      history.replaceState(null, '', `${location.pathname}#catalogo-livros`);
      if (cartItems.length) {
       checkoutDialog.showModal();
       cartView.hidden = true;
       checkoutForm.hidden = false;
       checkoutForm.elements.customer_name.focus();
      }
     }
     return true;
    };

    const showDatabaseCatalog = (books) => {
     const section = root.querySelector('#galeria');
     const container = section && section.querySelector(':scope > div');
     const grid = container && container.querySelector('.grid');
     if (!section || !container || !grid) return false;
     return renderPublishedBookShop(books);

     let toolbar = container.querySelector('.catalog-toolbar');
     if (!toolbar) {
      toolbar = document.createElement('div');
      toolbar.className = 'catalog-toolbar';

      const search = document.createElement('input');
      search.type = 'search';
      search.className = 'catalog-control catalog-search';
      search.placeholder = 'Buscar por título ou autor';
      search.setAttribute('aria-label', 'Buscar livros por título ou autor');
      search.addEventListener('input', () => {
       catalogSearch = search.value.trim().toLocaleLowerCase('pt-BR');
       catalogPage = 1;
       showDatabaseCatalog(catalogBooks || []);
      });

      const category = document.createElement('select');
      category.className = 'catalog-control catalog-category';
      category.setAttribute('aria-label', 'Filtrar livros por categoria');
      category.addEventListener('change', () => {
       catalogCategory = category.value;
       catalogPage = 1;
       showDatabaseCatalog(catalogBooks || []);
      });

      const sort = document.createElement('select');
      sort.className = 'catalog-control catalog-sort';
      sort.setAttribute('aria-label', 'Ordenar livros');
      [
       ['newest', 'Mais recentes'],
       ['title', 'Título: A a Z'],
       ['price-asc', 'Menor preço'],
       ['price-desc', 'Maior preço']
      ].forEach(([value, label]) => {
       const option = document.createElement('option');
       option.value = value;
       option.textContent = label;
       sort.append(option);
      });
      sort.addEventListener('change', () => {
       catalogSort = sort.value;
       catalogPage = 1;
       showDatabaseCatalog(catalogBooks || []);
      });

      toolbar.append(search, category, sort);
      grid.before(toolbar);
     }

     const categories = [...new Set(books.map((book) => String(book.category || '').trim()).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'pt-BR'));
     const categorySelect = toolbar.querySelector('.catalog-category');
     const selectedCategory = categories.includes(catalogCategory) ? catalogCategory : '';
     if (selectedCategory !== catalogCategory) catalogCategory = selectedCategory;
     categorySelect.replaceChildren();
     const allCategories = document.createElement('option');
     allCategories.value = '';
     allCategories.textContent = 'Todas as categorias';
     categorySelect.append(allCategories);
     categories.forEach((value) => {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      categorySelect.append(option);
     });
     categorySelect.value = catalogCategory;
     toolbar.querySelector('.catalog-search').value = catalogSearch;
     toolbar.querySelector('.catalog-sort').value = catalogSort;

     if (!books.length) {
      section.hidden = true;
      const featuredSection = root.querySelector('#destaque');
      if (featuredSection) featuredSection.hidden = true;
      grid.replaceChildren();
      delete grid.dataset.databaseBooksRendered;
      return true;
     }

     section.hidden = false;
     const featuredSection = root.querySelector('#destaque');
     if (featuredSection) featuredSection.hidden = false;
     const query = catalogSearch;
     let filteredBooks = books.filter((book) => {
      const matchesCategory = !catalogCategory || String(book.category || '').trim() === catalogCategory;
      const searchableText = `${book.title || ''} ${book.author || ''} ${book.category || ''}`.toLocaleLowerCase('pt-BR');
      return matchesCategory && (!query || searchableText.includes(query));
     });
     if (catalogSort === 'title') filteredBooks.sort((a, b) => String(a.title || '').localeCompare(String(b.title || ''), 'pt-BR'));
     if (catalogSort === 'price-asc') filteredBooks.sort((a, b) => Number(a.price) - Number(b.price));
     if (catalogSort === 'price-desc') filteredBooks.sort((a, b) => Number(b.price) - Number(a.price));
     if (catalogSort === 'newest') filteredBooks.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

     const pageCount = Math.max(1, Math.ceil(filteredBooks.length / catalogPageSize));
     catalogPage = Math.min(catalogPage, pageCount);
     const startIndex = (catalogPage - 1) * catalogPageSize;
     const visibleBooks = filteredBooks.slice(startIndex, startIndex + catalogPageSize);
     const signature = `${catalogPage}:${catalogSearch}:${catalogCategory}:${catalogSort}:` +
      visibleBooks.map((book) => `${book.id}:${book.updated_at || book.created_at || ''}`).join('|');
     if (grid.dataset.databaseBooksRendered === signature) return true;

     const cards = visibleBooks.map((book) => {
      const article = document.createElement('article');
      article.className = 'group flex flex-col border border-white/10 bg-white/[0.02] p-4 transition-colors duration-300 hover:border-red-900/70 hover:bg-white/[0.035]';
      article.dataset.databaseBook = String(book.id);

      const cover = document.createElement('div');
      cover.className = 'relative aspect-[2/3] overflow-hidden bg-card mb-5';
      const image = document.createElement('img');
      image.className = 'w-full h-full inset-0 absolute object-cover transition-transform duration-700 group-hover:scale-105';
      image.src = book.cover_image || '/logo.png';
      image.alt = `Capa de ${book.title || 'livro'}`;
      image.loading = 'lazy';
      image.addEventListener('error', () => {
       if (image.src !== new URL('/logo.png', location.href).href) image.src = '/logo.png';
      }, { once: true });
      cover.append(image);

      const details = document.createElement('div');
      details.className = 'flex flex-col flex-1';
      const category = document.createElement('p');
      category.className = 'text-[10px] tracking-caps uppercase text-accent mb-3';
      category.textContent = book.category || 'Nocturnal Chronicles';
      const badges = document.createElement('div');
      badges.className = 'absolute top-3 left-3 flex flex-wrap gap-2';
      if (book.is_featured) {
       const badge = document.createElement('span');
       badge.className = 'catalog-featured-label bg-black/80 px-2 py-1 uppercase tracking-wider';
       badge.textContent = 'Destaque';
       badges.append(badge);
      }
      if (badges.childElementCount) cover.append(badges);
      const title = document.createElement('h3');
      title.className = 'font-display text-2xl leading-tight mb-1';
      title.textContent = book.title || 'Livro sem título';
      const author = document.createElement('p');
      author.className = 'text-muted-foreground mb-4';
      author.textContent = `por ${book.author || 'Autor(a) não informado(a)'}`;
      const description = document.createElement('p');
      description.className = 'catalog-book-description text-muted-foreground leading-relaxed mb-6';
      description.textContent = book.description || 'Conheça este livro publicado na coleção Nocturnal Chronicles.';
      const footer = document.createElement('div');
      footer.className = 'mt-auto flex items-center justify-between gap-3 border-t border-border pt-4';
      const price = document.createElement('span');
      price.className = 'font-display text-2xl';
      price.textContent = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(book.price) || 0);
      const action = document.createElement('button');
      action.type = 'button';
      action.className = 'inline-flex items-center justify-center px-4 py-3 bg-accent text-primary-foreground text-[11px] tracking-caps uppercase transition-colors hover:bg-accent/90';
      action.textContent = 'Ver detalhes';
      action.addEventListener('click', () => {
       updateFeaturedBook(book);
       location.hash = '#destaque';
      });

      footer.append(price, action);
      details.append(category, title, author, description, footer);
      article.append(cover, details);
      return article;
     });

     grid.replaceChildren(...cards);
     grid.dataset.databaseBooksRendered = signature;

     const sectionHeading = section.querySelector('h2');
     if (sectionHeading) sectionHeading.textContent = 'Livros publicados';
     const sectionSubtitle = container.querySelector(':scope > div:first-child > p');
     if (sectionSubtitle) sectionSubtitle.textContent = `${books.length} ${books.length === 1 ? 'livro disponível' : 'livros disponíveis'} na coleção.`;

     let results = container.querySelector('.catalog-results');
     if (!results) {
      results = document.createElement('div');
      results.className = 'catalog-results';
      results.setAttribute('aria-live', 'polite');
      toolbar.after(results);
     }
     results.textContent = filteredBooks.length
      ? `Exibindo ${startIndex + 1}–${Math.min(startIndex + visibleBooks.length, filteredBooks.length)} de ${filteredBooks.length} livros`
      : 'Nenhum livro corresponde à busca.';
     if (!filteredBooks.length) {
      const empty = document.createElement('div');
      empty.className = 'catalog-empty';
      empty.textContent = 'Não encontramos livros com esses filtros. Tente outra busca ou categoria.';
      grid.replaceChildren(empty);
     }

     let pagination = container.querySelector('.catalog-pagination');
     if (!pagination) {
      pagination = document.createElement('nav');
      pagination.className = 'catalog-pagination';
      pagination.setAttribute('aria-label', 'Paginação do catálogo');
      const previous = document.createElement('button');
      previous.type = 'button';
      previous.className = 'catalog-page-button';
      previous.textContent = '← Anterior';
      previous.addEventListener('click', () => {
       catalogPage = Math.max(1, catalogPage - 1);
       showDatabaseCatalog(catalogBooks || []);
      });
      const pageLabel = document.createElement('span');
      pageLabel.className = 'catalog-page-label text-muted-foreground text-sm';
      const next = document.createElement('button');
      next.type = 'button';
      next.className = 'catalog-page-button';
      next.textContent = 'Próxima →';
      next.addEventListener('click', () => {
       catalogPage += 1;
       showDatabaseCatalog(catalogBooks || []);
      });
      pagination.append(previous, pageLabel, next);
      grid.after(pagination);
     }
     pagination.hidden = filteredBooks.length === 0;
     pagination.children[0].disabled = catalogPage <= 1;
     pagination.children[1].textContent = `Página ${catalogPage} de ${pageCount}`;
     pagination.children[2].disabled = catalogPage >= pageCount;

     const featured = books.find((book) => book.is_featured) || books[0];
     updateFeaturedBook(featured);
     return true;
    };

    const loadCatalog = async () => {
     if (catalogRequestStarted) return;
     catalogRequestStarted = true;
     try {
      const response = await fetch('/api/books');
      if (!response.ok) throw new Error(`Não foi possível carregar os livros (${response.status}).`);
      const books = await response.json();
      if (!Array.isArray(books)) throw new Error('A resposta do catálogo está em um formato inválido.');
      catalogBooks = books;
      showDatabaseCatalog(catalogBooks);
     } catch (error) {
      const section = root.querySelector('#galeria');
      if (!section) {
       catalogRequestStarted = false;
       return;
      }
      let notice = section.querySelector('.catalog-load-error');
      if (!notice) {
       notice = document.createElement('p');
       notice.className = 'catalog-load-error text-center text-accent mt-6';
       section.querySelector(':scope > div')?.append(notice);
      }
      notice.textContent = error.message;
     }
    };

    const replaceCartIcon = (headerInner) => {
     const cartButton = Array.from(headerInner.querySelectorAll('button'))
      .find((button) => button.textContent.includes('Carrinho'));
     const oldIcon = cartButton && cartButton.querySelector('svg');
     if (!oldIcon || oldIcon.dataset.cartStyle === 'trolley') return;

     const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
     icon.setAttribute('viewBox', '0 0 24 24');
     icon.setAttribute('fill', 'none');
     icon.setAttribute('stroke', 'currentColor');
     icon.setAttribute('stroke-width', '2');
     icon.setAttribute('stroke-linecap', 'round');
     icon.setAttribute('stroke-linejoin', 'round');
     icon.setAttribute('class', oldIcon.getAttribute('class') || 'w-4 h-4');
     icon.dataset.cartStyle = 'trolley';

     const makeShape = (name, attrs) => {
      const shape = document.createElementNS('http://www.w3.org/2000/svg', name);
      Object.entries(attrs).forEach(([key, value]) => shape.setAttribute(key, value));
      return shape;
     };

     icon.append(
      makeShape('circle', { cx: '9', cy: '21', r: '1' }),
      makeShape('circle', { cx: '20', cy: '21', r: '1' }),
      makeShape('path', { d: 'M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 1.97-1.61L23 6H6' })
     );
     oldIcon.replaceWith(icon);
    };

    const renderBookstoreAbout = () => {
     const section = root.querySelector('#vozes, #sobre');
     if (!section) return;

     section.id = 'sobre';
     if (section.dataset.bookstoreAbout === 'true') return;

     const content = section.querySelector('.relative.z-10');
     if (!content) return;

     content.innerHTML = `
      <p class="text-[12px] tracking-caps uppercase text-accent mb-4 text-center">Sobre a livraria</p>
      <h2 class="font-display text-4xl lg:text-6xl leading-tight text-center mb-8">Um espaço para quem ama histórias <span class="italic">intensas.</span></h2>
      <p class="bookstore-about-copy">Se você gosta de histórias intensas, personagens cheios de camadas e romances que fogem do óbvio, chegou ao lugar certo. A Nocturnal Chronicles é uma livraria online para encontrar sua próxima leitura de dark romance. Conheça os livros, descubra novos autores e escolha sem pressa a história que combina com você.</p>
      <div class="bookstore-about-grid">
       <article class="bookstore-about-card">
        <h3>Histórias intensas</h3>
        <p>Nosso foco é dark romance: romances sombrios, personagens complexos e tramas cheias de tensão.</p>
       </article>
       <article class="bookstore-about-card">
        <h3>Escolha sua próxima leitura</h3>
        <p>Veja as sinopses, conheça os autores e confira os livros disponíveis no catálogo.</p>
       </article>
       <article class="bookstore-about-card">
        <h3>Novidades da loja</h3>
        <p>Tem livro novo chegando? Você pode acompanhar os lançamentos e outras novidades por e-mail.</p>
       </article>
      </div>
      <div class="bookstore-about-action"><a href="#catalogo-livros">Explorar os livros</a></div>`;
     section.dataset.bookstoreAbout = 'true';
    };

    const setupNewsletter = () => {
     const section = root.querySelector('#pacto, #novidades');
     if (!section) return;

     section.id = 'novidades';
     const label = section.querySelector('.text-accent');
     const heading = section.querySelector('h2');
     const description = heading && heading.nextElementSibling;
     const form = section.querySelector('form');
     const input = form && form.querySelector('input[type="email"]');
     const button = form && form.querySelector('button[type="submit"]');
     if (!label || !heading || !description || !form || !input || !button) return;

     setText(label, 'Fique por dentro');
     setText(heading, 'Receba novidades');
     setText(description, 'Cadastre seu e-mail para saber das novidades e dos próximos lançamentos da livraria.');
     input.placeholder = 'Seu melhor e-mail';
     input.setAttribute('aria-label', 'Seu e-mail para receber novidades');
     setText(button, 'Quero receber');

     let feedback = form.nextElementSibling;
     if (!feedback || !feedback.classList.contains('newsletter-feedback')) {
      feedback = document.createElement('p');
      feedback.className = 'newsletter-feedback';
      feedback.setAttribute('aria-live', 'polite');
      form.after(feedback);
     }
     setupNewsletterForm(form, input, button, feedback);
    };

    const renameMenuLinks = () => {
     const links = root.querySelectorAll('header nav a[href]');
     const menu = [
      { href: '#top', label: 'Página inicial' },
      { href: '#catalogo-livros', label: 'Livros' },
      { href: '#sobre', label: 'Sobre nós' },
      { href: '#novidades', label: 'Novidades' }
     ];
     links.forEach((link, index) => {
      const item = menu[index];
      if (!item) return;
      if (link.getAttribute('href') !== item.href) link.setAttribute('href', item.href);
      if (link.textContent.trim() !== item.label) link.textContent = item.label;
     });
    };

    const mountBrandLogo = () => {
     const brandLink = root.querySelector('header a.brand-logo-link, header > div > a:first-child');
     if (!brandLink) return;
     brandLink.href = '#top';
     if (brandLink.querySelector('.brand-logo-image')) return;

     const image = document.createElement('img');
     image.className = 'brand-logo-image';
     image.src = '/logo.png';
     image.alt = '';
     image.setAttribute('aria-hidden', 'true');
     brandLink.classList.add('brand-logo-link');
     brandLink.insertBefore(image, brandLink.firstChild);
    };

    const cropHeroImageEdge = () => {
     const image = root.querySelector('main section img.object-cover.absolute');
     if (image) image.classList.add('hero-background-image');
    };

    const syncMenu = () => {
     root = document.querySelector('#root');
     shortcut = document.querySelector('.account-shortcut');
     if (!root || !shortcut) return;
     refreshAccountShortcut();
     syncPageRoute();
     const headerInner = root.querySelector('header > div');
     if (!headerInner) return;

     if (!catalogBooks) loadCatalog();
     cropHeroImageEdge();
     renderBookstoreAbout();
     setupNewsletter();
     renameMenuLinks();
     mountBrandLogo();
     replaceCartIcon(headerInner);
     const cartButton = Array.from(headerInner.querySelectorAll('button'))
      .find((button) => button.textContent.includes('Carrinho'));
     if (cartButton && cartButton.dataset.databaseCart !== 'true') {
      cartButton.dataset.databaseCart = 'true';
      cartButton.addEventListener('click', (event) => {
       event.preventDefault();
       event.stopImmediatePropagation();
       const dialog = root.querySelector('.database-checkout-dialog');
       if (!dialog) return;
       renderShopCart();
       if (!dialog.open) dialog.showModal();
      }, true);
     }

     if (shortcut.parentElement !== headerInner) {
       const cartButton = headerInner.querySelector('button');
       headerInner.insertBefore(shortcut, cartButton || null);
     }
    };
    let pendingMenuSync = false;
    const scheduleMenuSync = () => {
     if (pendingMenuSync) return;
     pendingMenuSync = true;
     requestAnimationFrame(() => {
       pendingMenuSync = false;
       syncMenu();
     });
    };

    syncMenu();
    window.addEventListener('popstate', scheduleMenuSync);
    window.addEventListener('hashchange', scheduleMenuSync);
    window.addEventListener('load', scheduleMenuSync);
    const menuObserver = new MutationObserver(scheduleMenuSync);
    menuObserver.observe(document.body, { childList: true, subtree: true });
    let startupAttempts = 0;
    const startupSync = setInterval(() => {
     startupAttempts += 1;
     if (document.querySelector('#root header > div') || startupAttempts >= 50) {
      clearInterval(startupSync);
      scheduleMenuSync();
     }
    }, 100);
   })();
  </script>
 </body>
</html>
